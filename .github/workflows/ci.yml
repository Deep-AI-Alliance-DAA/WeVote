name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check syntax
        run: npm run check
      - name: Check event config cache
        run: npm run test:cache
      - name: Check local and deployment setup
        run: npm run test:setup
      - name: Check local Worker startup recovery
        run: npm run test:startup
      - name: Build Pages bundle
        run: npm run build:pages
      - name: Test local Worker, accounts, and drafts
        run: npm run test:local
